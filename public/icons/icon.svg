      <path d="M20 2 C10 2, 2 10, 2 20 C2 23.5, 3 26.8, 4.8 29.5 L2 38 L10.8 35.3 C13.5 37, 16.6 38, 20 38 C30 38, 38 30, 38 20 C38 10, 30 2, 20 2 Z M15.5 12.5 C16.5 12.5, 17 13.5, 17.5 14.5 C18 15.5, 18.5 16.5, 18.2 17.2 C18 17.8, 17.5 18.2, 17 18.5 C16.5 18.8, 16 19.2, 16.5 20 C17.5 21.8, 19.2 23.5, 21 24.5 C21.8 25, 22.2 24.5, 22.5 24 C22.8 23.5, 23.2 23, 23.8 22.8 C24.5 22.5, 25.5 23, 26.5 23.5 C27.5 24, 28.5 24.5, 28.5 25.5 C28.5 27, 26.5 28.5, 25 28.5 C23 28.5, 19.5 26.5, 16.5 23.5 C13.5 20.5, 11.5 17, 11.5 15 C11.5 13.5, 13 11.5, 14.5 11.5 Z" fill="#ffffff" transform="translate(6,6) scale(0.7)" />
