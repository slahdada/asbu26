    <path d="M140 32 L140 110" fill="none" stroke="#334155" stroke-width="8" />

    <!-- Car body base -->
    <path d="M24 110 L256 110 C269 110, 280 121, 280 134 L280 180 C280 188, 273 195, 265 195 L250 195 C242 195, 235 188, 235 180 L235 170 L45 170 L45 180 C45 188, 38 195, 30 195 L15 195 C7 195, 0 188, 0 180 L0 134 C0 121, 11 110, 24 110 Z" fill="#f8fafc" />

