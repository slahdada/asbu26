    <path d="M72 110 L96 48 C100 38, 110 32, 122 32 L158 32 C170 32, 180 38, 184 48 L208 110" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
