    <circle cx="60" cy="195" r="10" fill="#f8fafc" />
    
    <circle cx="220" cy="195" r="28" fill="#0f172a" stroke="#22c55e" stroke-width="8" />
    <circle cx="220" cy="195" r="10" fill="#f8fafc" />

